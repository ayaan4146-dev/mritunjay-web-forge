function nextQ(){QZ.i++;QZ.pick=-1;if(QZ.i>=QZ.items.length&&!QZ.mist){mUpd(QZ.sub,QZ.ch,QZ.sc,QZ.items.length);if(QZ.sc===QZ.items.length)xp(20);else if(QZ.sc/QZ.items.length>=.8)confetti()}render()}
function ansQ(i){if(QZ.pick>=0)return;const q=QZ.items[QZ.i];QZ.pick=i;QZ.ans.push({q,p:i});if(i===q.a){QZ.sc++;xp(5);if(QZ.mist)S.wrong=(S.wrong||[]).filter(w=>w.q!==q.q)}else if(!QZ.mist){S.wrong=S.wrong||[];if(!S.wrong.some(w=>w.q===q.q))S.wrong.push({s:QZ.sub,ch:QZ.ch,q:q.q,c:q.c||"",o:q.o,ai:q.a,a:q.o[q.a],e:q.e});save()}save();render()}
function Prog(){const p=S.profile,t=tdy(),g=S.goal||120,days=[0,1,2,3,4,5,6].map(i=>addD(i-6)),tot=Object.values(S.log||{}).reduce((a,b)=>a+b,0),mx=Math.max(g,...days.map(d=>mins(d))),all=plan().flat(),T=S.tasks||[];return `<h2>📊 Progress tracker</h2><div class="grid"><div class="card"><h3>🔥 Streak</h3><b style="font-size:30px">${S.streak||0} days</b></div><div class="card"><h3>⏱ Focus today</h3><b style="font-size:30px">${mins(t)} min</b><div class="bar"><i style="width:${Math.min(100,mins(t)/g*100)}%"></i></div></div><div class="card"><h3>📚 Total studied</h3><b style="font-size:30px">${(tot/60).toFixed(1)} h</b></div></div><div class="card"><h3>🎯 Goals</h3><div class="row"><label>Daily focus goal (min) <input type="number" min="10" max="600" value="${g}" style="width:90px" onchange="S.goal=+this.value||120;save();render()"></label><label>Exam date <input type="date" value="${p.date||""}" style="width:auto" onchange="S.profile.date=this.value;save();render()"></label></div></div><div class="card"><h3>Last 7 days (focus minutes)</h3><div class="row" style="align-items:flex-end;height:120px;flex-wrap:nowrap;gap:8px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="height:${Math.max(4,mins(d)/mx*90)}px;background:var(--ac2);border-radius:6px"></div><small>${mins(d)}</small></div>`).join("")}</div></div>${MastCard()}<div class="card"><h3>Subject-wise progress</h3>${Object.keys(p.conf).map(s=>{const a=all.filter(x=>x.s===s),d=a.filter(x=>S.done[x.id]).length,tk=T.filter(x=>x.s===s),k=tk.filter(x=>x.done).length,n=a.length+tk.length,pc=n?Math.round((d+k)/n*100):0;return `<div style="margin:10px 0"><b>${s}</b> <span class="chip">${pc}% done</span> <span class="chip">confidence ${p.conf[s]}/5</span><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join("")}</div>`}
function Board(){return `<h2>🏆 Leaderboard</h2><p class="mu">Compete with classmates. Everyone who opens the page is ranked by XP.</p><div id="lb">${db?"Loading…":'<p class="mu">The leaderboard needs a signed-in claude.ai viewer.</p>'}</div>`}
function bsub(){if(!db)return;pushScore();try{unsub=db.collection("scores").orderBy("xp","desc").limit(20).onSnapshot(s=>{const f=$("#lb");if(!f)return;const r=s.docs.map(d=>d.data?d.data():d);f.innerHTML=r.length?r.map((x,i)=>`<div class="card"><b>${["🥇","🥈","🥉"][i]||(i+1)+"."}</b> ${esc(x.name)} <span class="chip">Class ${esc(x.grade)}</span> <b>${esc(x.xp)} XP</b> · 🔥 ${esc(x.streak||0)}</div>`).join(""):'<p class="mu">No scores yet. Earn some XP!</p>'},()=>{})}catch(e){}}
function AI(){return `<h2>🦉 Owl tutor</h2><div class="card" style="--cc:#10b981"><p>Ask the owl your doubts. It gives <b>hints first</b> so you learn the method, then shows the full solution when you ask for it.</p><div class="row"><button onclick="openOwl()">🦉 Open the owl</button><label class="btn g">📷 Photo doubt<input type="file" accept="image/*" hidden onchange="openOwl(true);owlPhoto(this)"></label></div></div><div class="row">${[["Explain photosynthesis simply","explain"],["Quiz me on my weakest subject","quiz"],["Help me plan my revision","explain"]].map(x=>`<button class="g" onclick="openOwl(true);owlSend('${x[0]}','${x[1]}')">${x[0]}</button>`).join("")}</div>`}
async function solve(inp){const f=inp.files&&inp.files[0];if(!f)return;chat.push({role:"user",content:"📷 Photo doubt: "+f.name});chat.push({role:"assistant",content:"Reading your photo…"});render();try{const r=await AIcall([{role:"user",content:"A Class "+S.profile.grade+" student sent a photo of a question. Read it, explain the answer step by step in simple language, then give one similar practice question."}],{images:f,cache:false});chat[chat.length-1].content=r.text}catch(e){chat[chat.length-1].content="Couldn't read the photo: "+em(e)}render()}
window.QUOTES=["Small steps every day add up to big results.","You don't have to be perfect, just consistent.","Today's effort is tomorrow's confidence.","Every question you solve makes the next one easier.","Mistakes mean you're learning. Keep going.","Start now. Momentum will do the rest.","Your only competition is who you were yesterday.","Hard topics become easy with practice.","Rest is part of studying. Take your breaks.","Believe you can, then show up and do it.","One chapter at a time. One day at a time.","Focus for 25 minutes. You've got this.","Progress, not perfection.","The best time to start was yesterday. The next best time is now.","Discipline beats motivation on tired days.","Your future self will thank you for today.","Ask doubts early. Every great student does.","Revise a little, remember a lot.","You are closer than you were an hour ago.","Dream big, study smart, stay kind."];
let QI=new Date().getDate()%QUOTES.length;
function quoteCard(){return `<div class="card" style="--cc:#ec4899"><p class="qt">“${QUOTES[QI]}”</p><button class="g" onclick="QI=(QI+1)%QUOTES.length;render()">💬 New quote</button></div>`}
function tour(){return S.tour?"":`<div class="card" style="--cc:#06b6d4"><h3>👋 New here? Start in 3 steps</h3><ol><li>Open <b>Planner</b> and add today's goals.</li><li>Start a 25-minute round in <b>Focus</b>.</li><li>Test yourself in <b>Revise</b>.</li></ol><button onclick="S.tour=true;save();render()">Got it</button></div>`}
const em=e=>(e&&(e.message||e.code))||"error";
async function AIcall(input,opt){await READY;if(!sample)throw{message:"AI features are not available on this site."};return sample(input,opt)}
function Me(){const p=S.profile;return `<h2>⚙ Profile</h2><div class="card"><p><b>${esc(p.name)}</b> · Class ${p.grade}</p>${Object.entries(p.conf).map(([s,v])=>`<div class="q"><span>${s}</span><div class="bar" style="width:55%"><i style="width:${v*20}%"></i></div></div>`).join("")}<h3>🎨 Theme</h3><div class="row">${["auto","light","dark"].map(t=>`<button class="${(S.theme||"auto")===t?"":"g"}" onclick="theme('${t}');render()">${{auto:"🌓 Auto",light:"☀️ Light",dark:"🌙 Dark"}[t]}</button>`).join("")}</div><h3>✨ Animations</h3><div class="row">${[["full","✨ Full"],["calm","😌 Calm (faster, fewer effects)"]].map(x=>`<button class="${(document.body.classList.contains("calm")?"calm":"full")===x[0]?"":"g"}" onclick="anim('${x[0]}')">${x[1]}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button onclick="draft={...p,name:p.name,conf:{...p.conf}};step=0;go('quiz')">Retake questionnaire</button><button class="g" onclick="logout()">Sign out</button></div></div>`}

const HAS_CL=typeof claude!=="undefined";
let OM="doubt",OH=0,OB=false,OL="",OSUB="Any subject";
const OIN="You are Owl, a friendly study tutor for an Indian (CBSE/NCERT) student. Reply in simple, short language (under 110 words unless giving a full solution). Use plain text with no markdown headings or LaTeX; write maths like x^2 or 3/4. Only help with studies; if asked about something else, kindly steer back. If the student sounds very stressed or unwell, be kind and suggest talking to a parent, teacher or counsellor.";
const MI={doubt:()=>OH===0?"Hint-first teaching: do NOT give the final answer. If the student has not shown an attempt, ask what they have tried or what part is confusing, and give one tiny first nudge. End with one short question for them to try.":"Hint-first teaching: the student wants hint number "+(OH+1)+". Give only the next small step or hint, not the final answer, and ask them to try the next step."+(OH>=2?" They have had several hints, so be more direct about the method.":""),solution:()=>"The student asked for the full solution. Give a clear step-by-step solution with the reason for each step, then one similar practice question for them to try.",explain:()=>"Explain the concept simply with one everyday example, then ask one short check question.",check:()=>"The student is sharing their own answer or working. Say if it is right. If not, kindly point to the first mistake and ask them to retry. Do not reveal the full answer.",quiz:()=>"Quiz the student: ask exactly ONE question at a time on the topic, wait for the answer, then give brief feedback and then the next question."};
const OMODES=[["doubt","💡 Doubt"],["explain","📖 Explain"],["check","✅ Check my answer"],["quiz","🎯 Quiz me"]];
const owlLog=()=>(S.owl=S.owl||[]);
function owlHead(){const p=S.profile,sel=$("#osub");if(sel&&p){sel.innerHTML=["Any subject",...Object.keys(p.conf)].map(x=>`<option${x===OSUB?" selected":""}>${esc(x)}</option>`).join("")}const m=$("#omo");if(m)m.innerHTML=OMODES.map(x=>`<button class="${x[0]===OM?"":"g"}" onclick="OM='${x[0]}';owlHead()">${x[1]}</button>`).join("")}
function owlDraw(){const m=$("#om");if(!m)return;const L=owlLog();m.innerHTML=L.length?L.map(x=>`<div class="${x.r==="u"?"ou":"oa"}">${x.t==="Thinking…"?'<span class="dots"><i></i><i></i><i></i></span>':esc(x.t)}</div>`).join(""):`<div class="oa">Hoot! I'm your study owl 🦉 Ask me a doubt. I'll give hints first so you learn the method, and show the full solution whenever you want it.</div>`;m.scrollTop=m.scrollHeight;const last=L[L.length-1],ok=last&&last.r==="a"&&!OB;$("#oact").innerHTML=ok?(OL==="doubt"?`<button class="g" onclick="owlSend('Give me another hint','doubt')">💡 Another hint</button><button class="g" onclick="owlSend('Show me the full solution','solution')">📖 Full solution</button>`:"")+`<button class="g" onclick="owlSave()">📝 Save to Notes</button>`:""}
function openOwl(force){if(!HAS_CL||!S.profile){owl();return}const o=$("#op");o.hidden=force===true?false:!o.hidden;$("#ob").style.display=o.hidden?"":"none";if(!o.hidden){owlHead();owlDraw();const q=$("#oq");if(q&&innerWidth>600)q.focus()}}
addEventListener("keydown",e=>{const o=$("#op");if(e.key==="Escape"&&o&&!o.hidden)openOwl()});
function owlClear(){S.owl=[];OH=0;save();owlDraw()}
function owlSave(){const L=owlLog(),l=L[L.length-1];if(!l||l.r!=="a")return;(S.notes=S.notes||[]).push({id:""+Date.now(),s:OSUB==="Any subject"?(weak()[0]||"General"):OSUB,t:l.t.slice(0,1200),f:false,st:0,next:addD(1)});save();$("#oact").innerHTML='<span class="mu">Saved to Notes ✓ (it will come up in Revise)</span>'}
function owlPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;OH=0;owlSend("Here is a photo of my question.","doubt",f)}
async function owlSend(text,mode,img){if(OB||!S.profile)return;const p=S.profile,ta=$("#oq"),q=(text||(ta&&ta.value)||"").trim();if(!q)return;if(!text){ta.value="";OH=0}mode=mode||OM;const L=owlLog();const hist=L.slice(-10).map(m=>(m.r==="u"?"Student: ":"Owl: ")+m.t.slice(0,600)).join("\n");L.push({r:"u",t:img?"📷 "+q:q});L.push({r:"a",t:"Thinking…"});OB=true;owlDraw();
const prompt=OIN+"\nStudent: "+p.name+", Class "+p.grade+". Subject: "+OSUB+". Weakest subjects: "+weak().slice(0,3).join(", ")+".\n"+MI[mode]()+(img?"\nThe student attached a photo of a question. Read it first and briefly restate it.":"")+"\n\nConversation so far:\n"+hist+"\nStudent: "+q;
try{const r=await AIcall([{role:"user",content:prompt}],{cache:false,images:img||undefined,onText:x=>{L[L.length-1].t=x.text;const m=$("#om");if(m&&m.lastElementChild){m.lastElementChild.textContent=x.text;m.scrollTop=m.scrollHeight}}});L[L.length-1].t=r.text;if(mode==="doubt")OH++;else if(mode==="solution")OH=0;OL=mode}catch(e){L[L.length-1].t="Sorry, I couldn't answer right now ("+em(e)+"). Tap send to try again.";OL=""}
OB=false;S.owl=L.slice(-40);save();owlDraw()}

const still=()=>document.body.classList.contains("calm")||matchMedia("(prefers-reduced-motion: reduce)").matches;
function anim(v){try{localStorage.setItem("shanim",v)}catch(e){}S.anim=v;save();document.body.classList.toggle("calm",v==="calm");if(view==="me")render()}
try{if(localStorage.getItem("shanim")==="calm")document.body.classList.add("calm")}catch(e){}
function fxp(n){if(still())return;const d=document.createElement("div");d.className="xpf";d.textContent="+"+n+" XP ⭐";document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
render();
</script></body></html>
